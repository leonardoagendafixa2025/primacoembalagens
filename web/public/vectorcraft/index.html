<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>VectorCraft Studio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #vectorcraft_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #vectorcraft_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e6edf3;
      background: #18191f;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 14px;
      font-weight: 500;
      color: #e6edf3;
      letter-spacing: 0.3px;
    }
    .status-sub {
      font-size: 11px;
      color: #8b949e;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <canvas id="vectorcraft_canvas" tabindex="1"></canvas>
  <div id="vectorcraft_loading">
    <div class="spinner"></div>
    <div class="status-text" id="status_msg">Carregando VectorCraft Studio (Rust + WebAssembly)...</div>
    <div class="status-sub">Inicializando motor de vetorização e aceleração gráfica WebGL/WebGPU</div>
  </div>

  <script type="module">
    const loader = document.getElementById("vectorcraft_loading");
    const statusMsg = document.getElementById("status_msg");

    try {
      if (statusMsg) statusMsg.textContent = "Carregando binários WebAssembly...";
      import init, * as bindings from './vectorcraft-web-6a8c4481c5b10cda.js';
      const wasm = await init({ module_or_path: './vectorcraft-web-6a8c4481c5b10cda_bg.wasm' });

      window.wasmBindings = bindings;
      window.vectorcraftWasm = wasm;

      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 300);
      }

      window.dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
      window.dispatchEvent(new CustomEvent("VectorCraftReady", { detail: { wasm, bindings } }));
      console.log("[VectorCraft] Rust WebAssembly inicializado com sucesso!");
    } catch (err) {
      console.error("[VectorCraft] Falha na inicialização do WebAssembly:", err);
      if (loader) {
        loader.innerHTML = `
          <div style="text-align:center;max-width:520px;padding:24px;background:#241a1a;border:1px solid #da3633;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.5);">
            <div style="font-size:24px;margin-bottom:8px;">⚠️</div>
            <div style="font-size:15px;font-weight:600;color:#f85149;margin-bottom:8px;">Falha ao inicializar o VectorCraft WebAssembly</div>
            <div style="font-size:12px;color:#c9d1d9;margin-bottom:16px;line-height:1.5;background:#160e0e;padding:10px;border-radius:6px;font-family:monospace;word-break:break-word;">${err?.message || err}</div>
            <div style="display:flex;gap:10px;justify-content:center;">
              <button onclick="location.reload()" style="background:#238636;color:white;border:none;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;">Tentar Novamente</button>
              <a href="https://vectorcraft.run/app/" target="_blank" style="display:inline-block;background:#30363d;color:#58a6ff;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;">Abrir Servidor Oficial (vectorcraft.run)</a>
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
