<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>VectorCraft</title>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #181920;
    }
    #vectorcraft_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #vectorcraft_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #b8b8b8;
      font: 14px system-ui, -apple-system, sans-serif;
      pointer-events: none;
      background: #181920;
      transition: opacity 0.3s ease;
    }
  </style>

  <script type="module">
    import init, * as bindings from './vectorcraft-web-6a8c4481c5b10cda.js';

    try {
      const wasm = await init({ module_or_path: './vectorcraft-web-6a8c4481c5b10cda_bg.wasm' });
      window.wasmBindings = bindings;
      window.vectorcraftWasm = wasm;

      const loader = document.getElementById("vectorcraft_loading");
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 300);
      }

      window.dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
    } catch (err) {
      console.error("[VectorCraft] Erro na inicialização WASM:", err);
      const loader = document.getElementById("vectorcraft_loading");
      if (loader) {
        loader.innerHTML = `
          <div style="text-align:center;max-width:500px;padding:24px;background:#241a1a;border:1px solid #da3633;border-radius:8px;color:#f85149;">
            <div style="font-size:24px;margin-bottom:8px;">⚠️</div>
            <div style="font-weight:600;margin-bottom:8px;">Falha ao carregar VectorCraft WebAssembly</div>
            <div style="font-size:12px;color:#c9d1d9;font-family:monospace;background:#160e0e;padding:8px;border-radius:4px;">${err?.message || err}</div>
          </div>
        `;
      }
    }
  </script>
  <link rel="modulepreload" href="./vectorcraft-web-6a8c4481c5b10cda.js" crossorigin="anonymous">
  <link rel="preload" href="./vectorcraft-web-6a8c4481c5b10cda_bg.wasm" as="fetch" type="application/wasm">
</head>
<body>
  <canvas id="vectorcraft_canvas" tabindex="1"></canvas>
  <div id="vectorcraft_loading">Carregando VectorCraft Studio&hellip;</div>
</body>
</html>
