<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>VectorCraft Studio</title>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #181920;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #vectorcraft_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #vectorcraft_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #b8b8b8;
      font: 14px system-ui, sans-serif;
      pointer-events: none;
      background: #181920;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(249, 115, 22, 0.2);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: vc-spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes vc-spin {
      to { transform: rotate(360deg); }
    }
    #discord_mask {
      position: absolute;
      top: 0;
      right: 216px;
      width: 82px;
      height: 36px;
      background: #383838;
      z-index: 50;
      pointer-events: auto;
    }
    #logo_mask {
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 36px;
      background: #383838;
      z-index: 50;
      pointer-events: auto;
    }
  </style>

  <script type="module">
    // Captura WebGL context para harmonizar cor das máscaras com a barra cinza
    let _gl = null;
    const _origGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type, attributes) {
      if (type === 'webgl2' || type === 'webgl') {
        attributes = Object.assign({}, attributes, { preserveDrawingBuffer: true });
      }
      const ctx = _origGetContext.call(this, type, attributes);
      if (type === 'webgl2' || type === 'webgl') {
        _gl = ctx;
      }
      return ctx;
    };

    function syncMaskColor() {
      if (!_gl) return;
      try {
        const pixel = new Uint8Array(4);
        const y = Math.max(0, _gl.drawingBufferHeight - 15);
        const x = Math.min(180, Math.floor(_gl.drawingBufferWidth / 2));
        _gl.readPixels(x, y, 1, 1, _gl.RGBA, _gl.UNSIGNED_BYTE, pixel);
        if (pixel[3] > 0 && !(pixel[0] === 0 && pixel[1] === 0 && pixel[2] === 0)) {
          const color = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
          const dMask = document.getElementById('discord_mask');
          const lMask = document.getElementById('logo_mask');
          if (dMask) dMask.style.backgroundColor = color;
          if (lMask) lMask.style.backgroundColor = color;
        }
      } catch (e) {
        // Fallback para background cinza definido no CSS
      }
    }
    let _colorChecks = 0;
    const _colorTimer = setInterval(() => {
      syncMaskColor();
      _colorChecks++;
      if (_colorChecks > 30) clearInterval(_colorTimer);
    }, 300);

    // Bloqueia qualquer abertura externa para o Discord
    const _origOpen = window.open;
    window.open = function(url, ...args) {
      if (typeof url === 'string' && url.includes('discord')) {
        console.log('[VectorCraft] Botão do Discord desativado.');
        return null;
      }
      return _origOpen ? _origOpen.apply(this, [url, ...args]) : null;
    };

    import init, * as bindings from './vectorcraft-web-6a8c4481c5b10cda.js';

    try {
      const wasm = await init({ module_or_path: './vectorcraft-web-6a8c4481c5b10cda_bg.wasm' });
      window.wasmBindings = bindings;
      window.vectorcraftWasm = wasm;

      const loader = document.getElementById("vectorcraft_loading");
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => { if (loader) loader.style.display = 'none'; }, 300);
      }

      window.dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
    } catch (err) {
      console.error("[VectorCraft] Falha ao carregar WebAssembly local:", err);
      // Fallback automático para o servidor oficial do VectorCraft se WebGL/WASM local falhar
      const loader = document.getElementById("vectorcraft_loading");
      if (loader) {
        loader.innerHTML = `
          <div style="text-align:center;max-width:440px;padding:20px;background:#241a1a;border:1px solid #da3633;border-radius:8px;color:#f85149;pointer-events:auto;">
            <div style="font-size:22px;margin-bottom:6px;">⚠️</div>
            <div style="font-weight:600;margin-bottom:6px;">Falha ao carregar VectorCraft WebAssembly</div>
            <div style="font-size:12px;color:#c9d1d9;margin-bottom:12px;">${err?.message || err}</div>
            <a href="https://vectorcraft.run/app/" style="display:inline-block;background:#f97316;color:#ffffff;padding:8px 16px;border-radius:4px;text-decoration:none;font-size:12px;font-weight:600;">Abrir Servidor Oficial (vectorcraft.run)</a>
          </div>
        `;
      }
    }
  </script>
  <link rel="modulepreload" href="./vectorcraft-web-6a8c4481c5b10cda.js" crossorigin="anonymous">
  <link rel="preload" href="./vectorcraft-web-6a8c4481c5b10cda_bg.wasm" as="fetch" type="application/wasm">
</head>
<body>
  <canvas id="vectorcraft_canvas" tabindex="1"></canvas>
  <div id="logo_mask" title=""></div>
  <div id="discord_mask" title=""></div>
  <div id="vectorcraft_loading">
    <div class="spinner"></div>
    <div>Iniciando VectorCraft Studio (Rust + WebAssembly)...</div>
  </div>
</body>
</html>
