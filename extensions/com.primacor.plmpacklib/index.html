<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PLMPackLib Studio 3D</title>
  <style>
    :root {
      --ai-bg: #1e2229;
      --ai-panel: #14171d;
      --ai-card: #282d37;
      --ai-border: #383f4d;
      --ai-text: #f1f5f9;
      --ai-muted: #94a3b8;
      --ai-accent: #00d2b4;
      --ai-accent-hover: #00b89e;
      --ai-primary: #3b82f6;
      --ai-success: #10b981;
      --ai-danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--ai-bg);
      color: var(--ai-text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Header */
    .studio-header {
      background: var(--ai-panel);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--ai-border);
      flex-shrink: 0;
    }

    .studio-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .brand-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 210, 180, 0.15);
      color: var(--ai-accent);
      border: 1px solid rgba(0, 210, 180, 0.3);
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ai-success);
      box-shadow: 0 0 6px var(--ai-success);
    }

    .status-dot.offline {
      background: var(--ai-danger);
      box-shadow: none;
    }

    /* 3D Viewport Box */
    .viewport-box {
      flex: 1;
      position: relative;
      background: #13161c;
      overflow: hidden;
      min-height: 220px;
    }

    #studioCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    #studioCanvas:active {
      cursor: grabbing;
    }

    /* Floating Viewport Overlays */
    .overlay-top-left {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }

    .overlay-top-right {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }

    .overlay-chip {
      background: rgba(20, 23, 29, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .overlay-chip:hover {
      background: rgba(35, 42, 54, 0.95);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .overlay-chip.active {
      background: rgba(0, 210, 180, 0.2);
      color: var(--ai-accent);
      border-color: rgba(0, 210, 180, 0.5);
    }

    .viewport-hint {
      position: absolute;
      bottom: 10px;
      left: 12px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
      z-index: 10;
    }

    /* Studio Controls Panel */
    .studio-panel {
      background: var(--ai-panel);
      border-top: 1px solid var(--ai-border);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Folding Slider Row */
    .folding-control {
      background: var(--ai-card);
      border: 1px solid var(--ai-border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .folding-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
    }

    .folding-label {
      color: var(--ai-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .folding-pct {
      color: var(--ai-accent);
      font-weight: 700;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-input {
      flex: 1;
      accent-color: var(--ai-accent);
      height: 4px;
      background: #334155;
      border-radius: 2px;
      cursor: pointer;
    }

    .btn-anim {
      background: #334155;
      border: 1px solid #475569;
      color: #ffffff;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      cursor: pointer;
    }

    .btn-anim:hover {
      background: #475569;
    }

    /* Action Buttons */
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-sync {
      width: 100%;
      background: linear-gradient(135deg, #00d2b4 0%, #00a896 100%);
      color: #041310;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 10px rgba(0, 210, 180, 0.25);
      transition: all 0.2s ease;
    }

    .btn-sync:hover {
      box-shadow: 0 4px 16px rgba(0, 210, 180, 0.4);
      transform: translateY(-1px);
    }

    .btn-sync:active {
      transform: translateY(0);
    }

    .sub-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn-secondary {
      background: #252b36;
      border: 1px solid var(--ai-border);
      color: #cbd5e1;
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-secondary:hover {
      background: #313845;
      color: #ffffff;
      border-color: #4b5563;
    }

    /* Log Box */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--ai-muted);
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .status-msg {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }
  </style>
</head>
<body>

  <!-- 1. Top Header -->
  <header class="studio-header">
    <div class="studio-brand">
      <span class="brand-title">PLMPackLib Studio 3D</span>
      <span id="modelTag" class="brand-badge">ECMA A2120</span>
    </div>
    <div class="header-status">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">CONECTADO</span>
    </div>
  </header>

  <!-- 2. Interactive 3D Viewport Box (Esko Studio Style) -->
  <main class="viewport-box">
    <!-- Viewport Overlays -->
    <div class="overlay-top-left">
      <button id="btnSubstrateCartao" class="overlay-chip active" title="Papel Cartão Duplex/Triplex">⚪ Cartão</button>
      <button id="btnSubstrateKraft" class="overlay-chip" title="Papel Kraft Ondulado">📦 Kraft</button>
    </div>

    <div class="overlay-top-right">
      <button id="btnViewIso" class="overlay-chip" title="Perspectiva Isométrica">📐 Iso</button>
      <button id="btnViewFront" class="overlay-chip" title="Visão Frontal">👁️ Frente</button>
      <button id="btnViewTop" class="overlay-chip" title="Visão Superior">⬆️ Topo</button>
      <button id="btnAutoRotate" class="overlay-chip" title="Girar Automaticamente">🔄</button>
    </div>

    <div class="viewport-hint">Arraste para girar • Scroll para zoom • Botão direito para mover</div>

    <!-- WebGL Canvas Container -->
    <div id="studioCanvas"></div>
  </main>

  <!-- 3. Studio Controls Panel -->
  <footer class="studio-panel">
    <!-- Folding Animation Slider -->
    <div class="folding-control">
      <div class="folding-header">
        <span class="folding-label">
          <span>📦</span>
          <span>Montagem da Embalagem</span>
        </span>
        <span id="txtFoldPct" class="folding-pct">100%</span>
      </div>
      <div class="slider-row">
        <input id="sliderFold" class="slider-input" type="range" min="0" max="100" value="100" />
        <button id="btnPlayFold" class="btn-anim" title="Animar Dobra">▶ Play</button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions-grid">
      <button id="btnSyncArtwork" class="btn-sync">
        <span>🔄</span>
        <span>ATUALIZAR 3D COM ARTE</span>
      </button>

      <div class="sub-actions">
        <button id="btnUpdateDieline" class="btn-secondary">
          <span>📐</span>
          <span>Atualizar Faca</span>
        </button>
        <button id="btnOpenWeb" class="btn-secondary">
          <span>🌐</span>
          <span>Abrir na Web</span>
        </button>
      </div>
    </div>

    <div class="status-bar">
      <span id="txtStatusMsg" class="status-msg">Pronto para visualização 3D.</span>
      <span id="txtVersion">Arte: v0</span>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="./js/CSInterface.js"></script>
  <script src="./js/studio.bundle.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
